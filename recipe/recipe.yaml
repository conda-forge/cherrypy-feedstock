schema_version: 1

context:
  version: "18.10.0"

package:
  name: cherrypy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/C/CherryPy/cherrypy-${{ version }}.tar.gz
  sha256: 6c70e78ee11300e8b21c0767c542ae6b102a49cac5cfd4e3e313d7bb907c5891

build:
  number: 2
  skip: match(python, "<3.5")
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - cherryd = cherrypy.__main__:run

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools_scm
    - setuptools
  run:
    - python
    - more-itertools
    - cheroot >=8.2.1
    - portend >=2.1.1
    - zc.lockfile
    - jaraco.collections
    - simplejson
    - routes >=2.3.1
    - pyopenssl
    - if: win
      then: pywin32

tests:
  - python:
      imports:
        - cherrypy
        - cherrypy.lib
        - cherrypy.process
        - cherrypy.scaffold
        - cherrypy.test
        - cherrypy.tutorial
      pip_check: false
  - script:
      - cherryd -h

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: Object-Oriented HTTP framework
  description: |
    CherryPy is a pythonic, object-oriented web framework.
    It allows developers to build web applications in much the same way they would
    build any other object-oriented Python program. This results in smaller source
    code developed in less time.
  homepage: http://www.cherrypy.org
  repository: https://github.com/cherrypy/cherrypy
  documentation: http://docs.cherrypy.org/en/latest

extra:
  recipe-maintainers:
    - pmlandwehr
    - carlodri
